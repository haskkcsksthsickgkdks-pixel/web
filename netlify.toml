# Netlify Configuration for Westwood Syndicate
[build]
  publish = "."

# [Optional] If you host the Node.js backend & Discord Bot on Render.com, Railway, or VPS,
# uncomment the lines below and insert your backend URL to proxy all /api requests:
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
